# Worker name must match the Cloudflare project: kazino-lakay
name = "kazino-lakay"
main = "src/production-entry.js"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

# Vite writes the frontend to ../dist relative to this config file.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/firebase-config.js"]

# Production is fail-closed. Do not enable these flags for this alpha.
[vars]
APP_MODE = "production"
DEMO_ENABLED = "false"
PAYMENTS_ENABLED = "false"
REAL_MONEY_GAMES_ENABLED = "false"

# Configure only after provisioning a separate PostgreSQL staging database.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_REAL_HYPERDRIVE_ID"
