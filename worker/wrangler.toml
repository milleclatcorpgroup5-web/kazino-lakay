# Worker name must match the Cloudflare project: kazino-lakay
name = "kazino-lakay"
main = "src/index.js"
compatibility_date = "2026-11-10"
workers_dev = true
# Keep dashboard variables when the Git-connected build deploys this Worker.
keep_vars = true

# The Vite build in the repository root creates ../dist relative to this file.
# Cloudflare serves the frontend from the same workers.dev origin as the API.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]
