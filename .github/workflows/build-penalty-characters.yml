name: Build realistic Penalty Lakay GLB characters

on:
  workflow_dispatch:
  push:
    branches: [main, fix/penalty-ara3d-016-football-kit-glbs]
    paths:
      - "characters/penalty-shooter.json"
      - "characters/penalty-keeper.json"
      - ".github/workflows/build-penalty-characters.yml"

permissions:
  contents: write

concurrency:
  group: penalty-character-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARA3D_VERSION: "0.16.0"
      ARA3D_CACHE: ${{ github.workspace }}/.ara3d-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Ara 3D character data
        uses: actions/cache@v4
        with:
          path: .ara3d-cache
          key: ara3d-data-${{ runner.os }}-${{ env.ARA3D_VERSION }}

      - name: Verify Ara 3D version, clothing IDs and football animation catalogue
        run: |
          npx --yes "ara3d@$ARA3D_VERSION" --version
          npx --yes "ara3d@$ARA3D_VERSION" schema character > /tmp/ara-character-schema.json
          npx --yes "ara3d@$ARA3D_VERSION" animations
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const schema = JSON.parse(fs.readFileSync('/tmp/ara-character-schema.json', 'utf8'));
          const params = schema.properties?.params?.properties;
          const required = {
            top: ['football_shirt', 'uniform_shirt_long'],
            bottom: ['cargo_shorts'],
            shoes: ['shoes03'],
            accessories: ['keeper_gloves', 'sport_socks']
          };
          for (const [field, ids] of Object.entries(required)) {
            const allowed = field === 'accessories'
              ? params?.[field]?.items?.enum
              : params?.[field]?.enum;
            for (const id of ids) {
              if (!allowed?.includes(id)) {
                throw new Error('Ara 3D ' + process.env.ARA3D_VERSION + ' does not support ' + field + ' ID "' + id + '". Supported IDs: ' + (allowed || []).join(', '));
              }
            }
          }
          const garmentIds = params?.garmentStyles?.propertyNames?.enum || [];
          for (const id of ['football_shirt', 'uniform_shirt_long', 'cargo_shorts', 'shoes03', 'keeper_gloves', 'sport_socks']) {
            if (!garmentIds.includes(id)) throw new Error('Invalid garmentStyles ID: ' + id);
          }
          console.log('Ara 3D schema confirms every Penalty Lakay clothing/accessory ID.');
          NODE

      - name: Generate high-detail rigged striker GLB
        run: |
          npx --yes "ara3d@$ARA3D_VERSION" export --params characters/penalty-shooter.json --detail high --animations idle,walk,run,soccer_shoot,cheer --out /tmp/penalty-shooter --debug
          mkdir -p public/models
          MODEL="$(find /tmp/penalty-shooter -type f -name '*.glb' -print -quit)"
          if [ -z "$MODEL" ]; then
            echo "::error::Ara 3D completed without producing a striker GLB."
            find /tmp/penalty-shooter -maxdepth 3 -type f -print || true
            exit 1
          fi
          cp "$MODEL" public/models/penalty-shooter.glb
          test -s public/models/penalty-shooter.glb

      - name: Generate high-detail rigged goalkeeper GLB
        run: |
          npx --yes "ara3d@$ARA3D_VERSION" export --params characters/penalty-keeper.json --detail high --animations idle,walk,run,keeper_ready,keeper_catch,keeper_dive_left,keeper_dive_right,keeper_low_dive_left,keeper_low_dive_right --out /tmp/penalty-keeper --debug
          MODEL="$(find /tmp/penalty-keeper -type f -name '*.glb' -print -quit)"
          if [ -z "$MODEL" ]; then
            echo "::error::Ara 3D completed without producing a goalkeeper GLB."
            find /tmp/penalty-keeper -maxdepth 3 -type f -print || true
            exit 1
          fi
          cp "$MODEL" public/models/penalty-keeper.glb
          test -s public/models/penalty-keeper.glb

      - name: Validate real skinned and animated GLB contents
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const files = [
            'public/models/penalty-shooter.glb',
            'public/models/penalty-keeper.glb'
          ];

          for (const file of files) {
            const data = fs.readFileSync(file);
            if (data.length < 20 || data.toString('ascii', 0, 4) !== 'glTF') {
              throw new Error(file + ' is not a binary glTF file');
            }
            if (data.readUInt32LE(8) !== data.length) {
              throw new Error(file + ' has an inconsistent GLB length header');
            }

            let offset = 12;
            let document;
            while (offset + 8 <= data.length) {
              const length = data.readUInt32LE(offset);
              const type = data.readUInt32LE(offset + 4);
              offset += 8;
              if (offset + length > data.length) throw new Error(file + ' contains a truncated GLB chunk');
              if (type === 0x4E4F534A) {
                document = JSON.parse(data.toString('utf8', offset, offset + length).replace(/\\0+$/g, '').trim());
                break;
              }
              offset += length;
            }

            if (!document) throw new Error(file + ' has no JSON glTF chunk');
            const skins = document.skins ?? [];
            const animations = document.animations ?? [];
            const meshes = document.meshes ?? [];
            const primitives = meshes.flatMap(mesh => mesh.primitives ?? []);
            const skinnedPrimitives = primitives.filter(primitive =>
              primitive.attributes?.JOINTS_0 !== undefined &&
              primitive.attributes?.WEIGHTS_0 !== undefined
            );
            const materials = document.materials ?? [];
            const textures = document.textures ?? [];
            const images = document.images ?? [];
            const nodes = document.nodes ?? [];
            const named = nodes.map(node => node.name || '').filter(Boolean);
            const faceNodes = named.filter(name => /head|eye|jaw|teeth|tongue/i.test(name));

            if (!skins.length || !skinnedPrimitives.length) {
              throw new Error(file + ' is not a genuinely rigged/skinned character (skin=' + skins.length + ', skinned primitives=' + skinnedPrimitives.length + ')');
            }
            if (!animations.length) throw new Error(file + ' contains no animation clips');
            if (!materials.length || !textures.length || !images.length) {
              throw new Error(file + ' is missing textured human materials (materials=' + materials.length + ', textures=' + textures.length + ', images=' + images.length + ')');
            }
            if (!faceNodes.length) console.warn('Face node names not explicit in ' + file + '; visual inspection remains required.');

            const sizeMb = (data.length / 1048576).toFixed(2);
            console.log(file + ': verified skinned GLB; ' + skins.length + ' skin(s), ' + skinnedPrimitives.length + ' skinned mesh primitive(s), ' + animations.length + ' animation(s), ' + materials.length + ' materials, ' + textures.length + ' textures, ' + sizeMb + ' MB');
            console.log('Animation clips: ' + animations.map(clip => clip.name || '(unnamed)').join(', '));
            if (data.length > 3 * 1048576) console.warn('NOTICE: ' + file + ' exceeds the 3 MB mobile target; high detail is intentionally prioritized for visual quality.');
          }
          NODE

      - name: Commit generated GLB assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/models/penalty-shooter.glb public/models/penalty-keeper.glb
          if git diff --cached --quiet; then
            echo "Generated models are unchanged."
            exit 0
          fi
          git commit -m "chore: generate high-detail penalty player GLBs"
          git push
