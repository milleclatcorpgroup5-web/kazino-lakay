name: Kazino Lakay Phase 1-3 validation

on:
  push:
    branches:
      - codex/kazino-v2.0.0-alpha.2-phase-1-3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check source syntax and tests
        run: |
          npm run check
          npm test
      - name: Build frontend
        run: npm run build
