name: Test Kazino Lakay Pages Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kazino-lakay-pages-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Cloudflare Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run checks, regression tests and Pages production build
        run: npm run build

      - name: Confirm Pages output exists
        run: test -s dist/index.html && test -s dist/admin.html && test -s dist/firebase-config.js
