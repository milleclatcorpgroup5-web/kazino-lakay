name: Kazino Lakay build and regression checks

on:
  push:
    branches:
      - codex/kazino-points-only-admin-repair
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Install dependencies
        run: npm install
      - name: Run syntax, game-engine, API and admin-routing tests
        run: npm run build
