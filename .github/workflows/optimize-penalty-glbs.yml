name: Optimize and verify Penalty Lakay human GLBs

on:
  workflow_dispatch:
  push:
    branches: [fix/penalty-human-rig-optimization]
    paths:
      - "scripts/optimize-glb.py"
      - "worker/test-penalty-glb.mjs"
      - ".github/workflows/optimize-penalty-glbs.yml"

permissions:
  contents: write

concurrency:
  group: penalty-glb-mobile-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optimizer dependencies
        run: python -m pip install --upgrade pip numpy pillow
      - name: Optimize both humanoid GLBs
        run: python scripts/optimize-glb.py public/models/penalty-shooter.glb public/models/penalty-keeper.glb
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify humanoid rigs, face bones, textures and animation clips
        run: node worker/test-penalty-glb.mjs
      - name: Commit optimized GLB assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/penalty-shooter.glb public/models/penalty-keeper.glb
          if git diff --cached --quiet; then
            echo "GLB assets are already optimized."
            exit 0
          fi
          git commit -m "chore: optimize penalty human GLBs for mobile"
          git push
